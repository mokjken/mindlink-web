name = "mindlink-backend"
main = "src/index.ts"
compatibility_date = "2024-04-01"

[[d1_databases]]
binding = "DB"
database_name = "mindlink-db"
database_id = "REPLACE_WITH_PRODUCTION_DATABASE_ID"

[observability]
enabled = true

[env.demo]
name = "mindlink-demo-backend"

[[env.demo.d1_databases]]
binding = "DB"
database_name = "mindlink-demo-db"
database_id = "REPLACE_WITH_DEMO_DATABASE_ID"

[env.demo.observability]
enabled = true
